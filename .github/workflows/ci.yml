name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Lint, typecheck, unit, gates, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run check:no-raw-colors
      - run: npm run build

  e2e:
    name: E2E + visual baseline (production build)
    # Windows runner: the committed pixel baselines carry the win32 platform
    # suffix and text antialiasing differs across platforms, so the visual
    # gate must run where the baselines were captured.
    runs-on: windows-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run build
      # webServer in playwright.config.ts starts `next start -p 3111`.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failures
          path: |
            test-results/
            evidence/artifacts/playwright-report/
          retention-days: 14
